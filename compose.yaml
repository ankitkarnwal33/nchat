version: "3.8"
services:
  db:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: neha
      POSTGRES_USER: ankit
      POSTGRES_DB: nchat
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
