<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
  </head>
  <body
    style="
      background-color: #f6f9fc;
      padding: 20px;
      font-family: Arial, sans-serif;
    "
  >
    <table
      align="center"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 500px;
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
      "
    >
      <tr>
        <td>
          <h2 style="font-size: 24px; margin-bottom: 20px">
            Reset your password
          </h2>

          <p style="font-size: 14px; color: #333">Hi {{userName}},</p>

          <p style="font-size: 14px; color: #333">
            We received a request to reset your password for your NChat account.
          </p>

          <p style="text-align: center; margin: 25px 0">
            <a
              href="{{resetUrl}}"
              style="
                background-color: #0070f3;
                color: #ffffff;
                padding: 12px 20px;
                border-radius: 5px;
                text-decoration: none;
                display: inline-block;
              "
            >
              Reset Password
            </a>
          </p>

          <p style="font-size: 14px; color: #333">
            This link will expire in 15 minutes for security reasons.
          </p>

          <p style="font-size: 14px; color: #333">
            If you didn’t request this, you can safely ignore this email.
          </p>

          <hr style="border: 1px solid #e6ebf1; margin: 20px 0" />

          <p style="font-size: 12px; color: #8898aa; text-align: center">
            © 2026 NChat. All rights reserved.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
